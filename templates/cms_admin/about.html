{% extends "cms_admin/base_cms.html" %}
{% load i18n %}

{% block title %}{% trans "About Page Editor" %}{% endblock %}
{% block page_title %}{% trans "Platform CMS" %}{% endblock %}
{% block tab_about %}active{% endblock %}

{% block cms_content %}
<div x-data="aboutEditor()" x-init="init()" class="space-y-6">

  <!-- Loading -->
  <template x-if="loading">
    <div class="animate-pulse space-y-4">
      <div class="h-8 bg-slate-200 dark:bg-slate-700 rounded-xl w-48"></div>
      <div class="card p-6 space-y-3">
        <template x-for="i in [1,2,3,4]" :key="i">
          <div class="h-10 bg-slate-200 dark:bg-slate-700 rounded-xl"></div>
        </template>
      </div>
    </div>
  </template>

  <template x-if="!loading">
    <div class="space-y-6">

      <!-- Section 1: About Content -->
      <div class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-slate-700/30">
          <i data-lucide="info" class="w-5 h-5 text-blue-500"></i>
          {% trans "About Content" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (EN)</label>
            <input type="text" x-model="form.about.title" class="input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (عربي)</label>
            <input type="text" x-model="form.about.title_ar" class="input" dir="rtl">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Subtitle" %} (EN)</label>
            <input type="text" x-model="form.about.subtitle" class="input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Subtitle" %} (عربي)</label>
            <input type="text" x-model="form.about.subtitle_ar" class="input" dir="rtl">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Main Content" %} (EN)</label>
            <textarea x-model="form.about.content" class="input" rows="5"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Main Content" %} (عربي)</label>
            <textarea x-model="form.about.content_ar" class="input" rows="5" dir="rtl"></textarea>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Image URL" %}</label>
            <div class="flex items-center gap-3">
              <input type="url" x-model="form.about.image_url" class="input flex-1">
              <template x-if="form.about.image_url">
                <img :src="form.about.image_url" class="w-16 h-16 rounded-xl object-cover border border-slate-200 dark:border-slate-600 flex-shrink-0" alt="">
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Mission & Vision -->
      <div class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-slate-700/30">
          <i data-lucide="target" class="w-5 h-5 text-violet-500"></i>
          {% trans "Mission & Vision" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Mission" %} (EN)</label>
            <textarea x-model="form.about.mission" class="input" rows="4" placeholder="{% trans "Our mission is..." %}"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Mission" %} (عربي)</label>
            <textarea x-model="form.about.mission_ar" class="input" rows="4" dir="rtl" placeholder="مهمتنا هي..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Vision" %} (EN)</label>
            <textarea x-model="form.about.vision" class="input" rows="4" placeholder="{% trans "Our vision is..." %}"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Vision" %} (عربي)</label>
            <textarea x-model="form.about.vision_ar" class="input" rows="4" dir="rtl" placeholder="رؤيتنا هي..."></textarea>
          </div>
        </div>
      </div>

      <!-- Section 3: Company Stats -->
      <div class="card p-6 space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-700/30">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="bar-chart-2" class="w-5 h-5 text-emerald-500"></i>
            {% trans "Company Stats" %}
          </h3>
          <button @click="form.company_stats.push({label:'',value:''})" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Stat" %}
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <template x-for="(stat, idx) in form.company_stats" :key="idx">
            <div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl">
              <div class="flex-1 grid grid-cols-2 gap-2">
                <input type="text" x-model="stat.label" class="input" placeholder="{% trans "Label" %}">
                <input type="text" x-model="stat.value" class="input" placeholder="10,000+">
              </div>
              <button @click="form.company_stats.splice(idx, 1)" class="text-slate-400 hover:text-red-500 flex-shrink-0">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </template>
          <template x-if="form.company_stats.length === 0">
            <p class="md:col-span-2 text-xs text-slate-400 text-center py-3">{% trans "No stats. Click Add Stat." %}</p>
          </template>
        </div>
      </div>

      <!-- Section 4: Core Values -->
      <div class="card p-6 space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-700/30">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="heart" class="w-5 h-5 text-red-500"></i>
            {% trans "Core Values" %}
          </h3>
          <button @click="form.core_values.push({title:'',title_ar:'',description:'',description_ar:'',icon:''})" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Value" %}
          </button>
        </div>
        <div class="space-y-3">
          <template x-for="(val, idx) in form.core_values" :key="idx">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/30 rounded-xl space-y-3">
              <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <input type="text" x-model="val.title" class="input" placeholder="{% trans "Title EN" %}">
                <input type="text" x-model="val.title_ar" class="input" dir="rtl" placeholder="العنوان">
                <input type="text" x-model="val.description" class="input" placeholder="{% trans "Desc EN" %}">
                <input type="text" x-model="val.description_ar" class="input" dir="rtl" placeholder="الوصف">
                <div class="flex items-center gap-2">
                  <input type="text" x-model="val.icon" class="input flex-1" placeholder="shield">
                  <template x-if="val.icon">
                    <span class="w-8 h-8 rounded-lg bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center flex-shrink-0">
                      <i :data-lucide="val.icon" class="w-4 h-4 text-primary-600 dark:text-primary-400"></i>
                    </span>
                  </template>
                </div>
              </div>
              <div class="flex justify-end">
                <button @click="form.core_values.splice(idx, 1)" class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> {% trans "Remove" %}
                </button>
              </div>
            </div>
          </template>
          <template x-if="form.core_values.length === 0">
            <p class="text-xs text-slate-400 text-center py-3">{% trans "No values yet." %}</p>
          </template>
        </div>
      </div>

      <!-- Section 5: Competitive Advantages -->
      <div class="card p-6 space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-700/30">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
            {% trans "Competitive Advantages" %}
          </h3>
          <button @click="form.advantages.push({title:'',title_ar:'',description:'',description_ar:'',icon:''})" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Advantage" %}
          </button>
        </div>
        <div class="space-y-3">
          <template x-for="(adv, idx) in form.advantages" :key="idx">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/30 rounded-xl space-y-3">
              <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <input type="text" x-model="adv.title" class="input" placeholder="{% trans "Title EN" %}">
                <input type="text" x-model="adv.title_ar" class="input" dir="rtl" placeholder="العنوان">
                <input type="text" x-model="adv.description" class="input" placeholder="{% trans "Desc EN" %}">
                <input type="text" x-model="adv.description_ar" class="input" dir="rtl" placeholder="الوصف">
                <div class="flex items-center gap-2">
                  <input type="text" x-model="adv.icon" class="input flex-1" placeholder="zap">
                  <template x-if="adv.icon">
                    <span class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-900/30 flex items-center justify-center flex-shrink-0">
                      <i :data-lucide="adv.icon" class="w-4 h-4 text-amber-600 dark:text-amber-400"></i>
                    </span>
                  </template>
                </div>
              </div>
              <div class="flex justify-end">
                <button @click="form.advantages.splice(idx, 1)" class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> {% trans "Remove" %}
                </button>
              </div>
            </div>
          </template>
          <template x-if="form.advantages.length === 0">
            <p class="text-xs text-slate-400 text-center py-3">{% trans "No advantages yet." %}</p>
          </template>
        </div>
      </div>

      <!-- Save Button -->
      <div class="flex justify-end pb-4">
        <button @click="save()" :disabled="saving" class="btn-primary">
          <i data-lucide="save" class="w-4 h-4"></i>
          <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save All Changes" %}'"></span>
        </button>
      </div>
    </div>
  </template>

</div>
{% endblock %}

{% block page_js %}
<script>
function aboutEditor() {
  return {
    loading: true,
    saving: false,
    form: {
      about: { title:'', title_ar:'', subtitle:'', subtitle_ar:'', content:'', content_ar:'', image_url:'', mission:'', mission_ar:'', vision:'', vision_ar:'' },
      company_stats: [],
      core_values: [],
      advantages: [],
    },

    async init() {
      this.loading = true;
      try {
        const data = await apiFetch('/api/v1/cms/admin/about/');
        if (data) {
          if (data.about) Object.assign(this.form.about, data.about);
          if (data.company_stats) this.form.company_stats = data.company_stats;
          if (data.core_values) this.form.core_values = data.core_values;
          if (data.advantages) this.form.advantages = data.advantages;
        }
      } catch (e) {
        notify('{% trans "Failed to load about page data" %}', 'error');
      } finally {
        this.loading = false;
        this.$nextTick(() => lucide.createIcons());
      }
    },

    async save() {
      this.saving = true;
      try {
        await apiFetch('/api/v1/cms/admin/about/', {
          method: 'PUT',
          body: JSON.stringify(this.form),
        });
        notify('{% trans "About page saved successfully" %}', 'success');
      } catch (e) {
        notify(e.message || '{% trans "Failed to save" %}', 'error');
      } finally {
        this.saving = false;
      }
    },
  };
}
</script>
{% endblock %}
