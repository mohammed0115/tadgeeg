{% extends "layouts/base_platform_admin.html" %}
{% load i18n %}
{% block page_title %}إدارة المنظمات{% endblock %}
{% block breadcrumb_current %}المنظمات{% endblock %}

{% block content %}
<div x-data="organizationsManager()" x-init="init()" class="space-y-5 fade-in">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">المنظمات</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">إدارة جميع المنظمات المسجلة في المنصة</p>
    </div>
    <button @click="openCreate()" class="btn-primary">
      <i data-lucide="plus" class="w-4 h-4"></i>
      إضافة منظمة
    </button>
  </div>

  <!-- Filter Bar -->
  <div class="card p-4 flex flex-wrap items-center gap-3">
    <input type="text" x-model.debounce.300ms="search" @input="load()"
           class="input max-w-xs" placeholder="البحث بالاسم أو البريد الإلكتروني...">
    <select x-model="statusFilter" @change="load()" class="select">
      <option value="">جميع الحالات</option>
      <option value="active">نشط</option>
      <option value="inactive">غير نشط</option>
      <option value="suspended">موقوف</option>
    </select>
    <div class="mr-auto"></div>
    <span class="text-xs text-slate-500" x-text="'الإجمالي: ' + total"></span>
  </div>

  <!-- Table -->
  <div class="card overflow-hidden">
    <template x-if="loading">
      <div class="animate-pulse divide-y divide-slate-100 dark:divide-slate-700/30">
        <template x-for="i in [1,2,3,4,5]" :key="i">
          <div class="px-5 py-4 flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 flex-shrink-0"></div>
            <div class="flex-1 space-y-2">
              <div class="h-3.5 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
              <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-60"></div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!loading && organizations.length === 0">
      <div class="px-5 py-16 text-center">
        <i data-lucide="building-2" class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-3"></i>
        <p class="text-slate-500 dark:text-slate-400 text-sm">لا توجد منظمات مطابقة</p>
      </div>
    </template>

    <template x-if="!loading && organizations.length > 0">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>المنظمة</th>
              <th>البريد الإلكتروني</th>
              <th>الخطة</th>
              <th>الحالة</th>
              <th>تاريخ التسجيل</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="org in organizations" :key="org.id">
              <tr>
                <td>
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500
                                flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
                         x-text="(org.name || '?')[0].toUpperCase()"></div>
                    <div>
                      <p class="font-semibold text-slate-800 dark:text-white text-sm" x-text="org.name"></p>
                      <p class="text-xs text-slate-400" x-text="org.name_ar || ''"></p>
                    </div>
                  </div>
                </td>
                <td class="text-slate-500" x-text="org.email || '—'"></td>
                <td>
                  <span class="badge-indigo" x-text="org.plan || 'free'"></span>
                </td>
                <td>
                  <span class="badge"
                        :class="{
                          'badge-green':  org.is_active,
                          'badge-red':    !org.is_active,
                        }"
                        x-text="org.is_active ? 'نشط' : 'غير نشط'"></span>
                </td>
                <td class="text-slate-400 text-xs"
                    x-text="org.created_at ? new Date(org.created_at).toLocaleDateString(APP_LOCALE) : '—'"></td>
                <td>
                  <div class="flex items-center gap-2">
                    <button @click="viewOrg(org)" class="btn-ghost text-xs px-3 py-1.5">
                      <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                    </button>
                    <button @click="toggleStatus(org)" class="btn-ghost text-xs px-3 py-1.5"
                            :class="org.is_active ? 'text-red-600 hover:text-red-700' : 'text-emerald-600 hover:text-emerald-700'">
                      <i :data-lucide="org.is_active ? 'ban' : 'check-circle'" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <!-- Pagination -->
    <template x-if="!loading && totalPages > 1">
      <div class="px-5 py-3.5 border-t border-slate-100 dark:border-slate-700/30 flex items-center justify-between">
        <p class="text-xs text-slate-500" x-text="'صفحة ' + page + ' من ' + totalPages"></p>
        <div class="flex gap-2">
          <button @click="page--; load()" :disabled="page <= 1" class="btn-ghost text-xs px-3 py-1.5 disabled:opacity-40">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
          <button @click="page++; load()" :disabled="page >= totalPages" class="btn-ghost text-xs px-3 py-1.5 disabled:opacity-40">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </template>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
function organizationsManager() {
  return {
    organizations: [],
    loading: true,
    search: '',
    statusFilter: '',
    page: 1,
    total: 0,
    totalPages: 1,
    pageSize: 20,

    async load() {
      this.loading = true;
      try {
        const params = new URLSearchParams({
          page: this.page,
          page_size: this.pageSize,
        });
        if (this.search) params.set('search', this.search);
        if (this.statusFilter) params.set('is_active', this.statusFilter === 'active');
        const res = await apiFetch('/api/v1/auth/organizations/?' + params.toString());
        if (res && res.ok) {
          const data = await res.json();
          this.organizations = Array.isArray(data) ? data : (data.results || []);
          this.total = data.count || this.organizations.length;
          this.totalPages = Math.ceil(this.total / this.pageSize);
        }
      } catch (e) {
        notify('تعذّر تحميل المنظمات', 'error');
      } finally {
        this.loading = false;
        this.$nextTick(() => lucide.createIcons());
      }
    },

    async init() {
      await this.load();
    },

    openCreate() {
        notify('سيتم إضافة هذه الميزة قريباً', 'info');
      },
  
    viewOrg(org) {
        window.open(`/api/platform-admin/organizations/${org.id}/`, '_blank');
      },

    async toggleStatus(org) {
      const action = org.is_active ? 'تعطيل' : 'تفعيل';
      if (!confirm(`هل أنت متأكد من ${action} المنظمة "${org.name}"؟`)) return;
      try {
        const res = await apiFetch(`/api/v1/auth/organizations/${org.id}/`, {
          method: 'PATCH',
          body: JSON.stringify({ is_active: !org.is_active }),
        });
        if (res && res.ok) {
          org.is_active = !org.is_active;
          notify(`تم ${action} المنظمة بنجاح`, 'success');
          this.$nextTick(() => lucide.createIcons());
        }
      } catch (e) {
        notify('فشل تحديث الحالة', 'error');
      }
    },
  };
}
</script>
{% endblock %}
