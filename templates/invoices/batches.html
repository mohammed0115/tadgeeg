{% extends "base.html" %}
{% block title %}الدفعات{% endblock %}
{% block page_title %}دفعات الرفع{% endblock %}
{% block nav_batches %}active{% endblock %}

{% block content %}
<div x-data="{
  batches:[],loading:true,
  async init(){
    try{
      const d=await apiFetch('/invoices/batches/?page_size=50');
      this.batches=d.results||d||[];
    }catch(e){notify('فشل التحميل','error');}
    this.loading=false;
    this.$nextTick(()=>lucide.createIcons());
  }
}" x-init="init()" class="space-y-4 max-w-screen-xl">

  <div class="card overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/30">
      <h3 class="font-semibold text-slate-800 dark:text-white">سجل الدفعات المرفوعة</h3>
    </div>

    <div x-show="loading" class="flex justify-center py-16">
      <svg class="animate-spin w-6 h-6 text-slate-300" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
        <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    </div>

    <div x-show="!loading" class="divide-y divide-slate-100 dark:divide-slate-700/20">
      <template x-for="b in batches" :key="b.id">
        <a :href="'/invoices/batches/'+b.id+'/'"
           class="flex items-center gap-4 px-5 py-4 hover:bg-slate-50 dark:hover:bg-slate-700/20 transition-colors cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center flex-shrink-0">
            <i data-lucide="layers" class="w-5 h-5 text-primary-500"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-slate-800 dark:text-white" x-text="b.batch_name||'دفعة بدون اسم'"></p>
            <p class="text-xs text-slate-400 mt-0.5"
               x-text="(b.created_at||'').slice(0,16).replace('T',' ') + ' · ' + (b.total_files||0) + ' ملف'"></p>
          </div>
          <div class="grid grid-cols-3 gap-4 text-center flex-shrink-0">
            <div>
              <div class="text-base font-bold font-mono text-slate-700 dark:text-slate-200" x-text="b.total_files||0"></div>
              <div class="text-[10px] text-slate-400">إجمالي</div>
            </div>
            <div>
              <div class="text-base font-bold font-mono text-emerald-600 dark:text-emerald-400" x-text="b.processed_files||0"></div>
              <div class="text-[10px] text-slate-400">معالج</div>
            </div>
            <div>
              <div class="text-base font-bold font-mono text-red-600 dark:text-red-400" x-text="b.failed_files||0"></div>
              <div class="text-[10px] text-slate-400">فشل</div>
            </div>
          </div>
          <span class="flex-shrink-0 badge text-xs"
                :class="{
                  'status-approved':  b.status==='completed',
                  'status-flagged':   b.status==='failed',
                  'status-pending':   b.status==='partial',
                  'status-processing':b.status==='processing',
                  'status-validated': b.status==='pending',
                }"
                x-text="{'completed':'مكتملة','partial':'جزئية','failed':'فشلت','processing':'جارٍ','pending':'انتظار'}[b.status]||b.status"></span>
        </a>
      </template>
      <div x-show="!loading&&!batches.length" class="text-center py-16 text-slate-400">
        <i data-lucide="layers" class="w-8 h-8 mx-auto mb-2"></i>
        <p class="text-sm">لا توجد دفعات بعد — ارفع فواتير أولاً</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
