version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0

  celery:
    build: .
    command: celery -A finai_backend worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - media_files:/app/media
    env_file: .env
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A finai_backend beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0

volumes:
  media_files:
