global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: production
    service: finai

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # configure alertmanager host if used

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: finai
    metrics_path: /metrics/
    # The bearer token must match METRICS_TOKEN in the Django .env
    bearer_token_file: /run/secrets/metrics_token   # Docker secret / K8s secret
    # -- OR use bearer_token directly (less secure, avoid in production):
    # bearer_token: changeme
    static_configs:
      - targets:
          - finai-web:8000     # docker-compose service name
        labels:
          instance: finai-web

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
