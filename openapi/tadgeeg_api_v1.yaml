        name: assigned_to
        schema:
          type: string
        description: Filter by assignee ID
      - in: query
        name: case_type
        schema:
          type: string
        description: Filter by type
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
