  /api/v1/audit/cases/bulk/:
    post:
      operationId: api_v1_audit_cases_bulk_create
      description: |-
        Bulk remediation endpoint (FR-4 gap fix).
        POST /api/v1/audit/cases/bulk/
        Body: {"ids": ["uuid", ...], "action": "resolve|close|archive|assign", "note": "", "assigned_to": "uuid"}
      summary: Bulk update audit case status
      tags:
      - Audit
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                action:
                  type: string
                  enum:
                  - resolve
                  - close
                  - archive
                  - assign
                note:
                  type: string
                assigned_to:
                  type: string
              required:
