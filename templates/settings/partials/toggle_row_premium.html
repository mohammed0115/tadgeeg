<div class="flex cursor-pointer items-center justify-between gap-4 rounded-lg border border-slate-100/60 bg-slate-50/50 px-3 py-3 transition-all duration-200 hover:bg-slate-100 dark:border-slate-800/60 dark:bg-slate-950/20 dark:hover:bg-slate-950/40"
     @click="{{ toggle_model }} = !{{ toggle_model }}">
  <div class="space-y-1">
    <p class="text-xs font-semibold text-slate-900 dark:text-white">{{ label }}</p>
    {% if description %}
    <p class="text-xs leading-relaxed text-slate-500 dark:text-slate-400">{{ description }}</p>
    {% endif %}
  </div>

  <button type="button"
          role="switch"
          @click.stop="{{ toggle_model }} = !{{ toggle_model }}"
          :aria-checked="{{ toggle_model }} ? 'true' : 'false'"
          class="relative mt-0.5 inline-flex h-5 w-9 shrink-0 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500/50"
          :class="{{ toggle_model }} ? 'bg-primary-600 shadow-md shadow-primary-500/30' : 'bg-slate-300 dark:bg-slate-700'">
    <span class="absolute inset-y-0.5 right-0.5 h-4 w-4 rounded-full bg-white shadow transition-transform duration-200"
          :class="{{ toggle_model }} ? '-translate-x-4' : 'translate-x-0'"></span>
  </button>
</div>
