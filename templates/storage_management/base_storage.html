{% extends "base.html" %}
{% load i18n %}

{% block nav_storage %}active{% endblock %}

{% block content %}
<div class="flex flex-col h-full">

  <!-- Storage sub-navigation -->
  <div class="bg-white dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700/40 px-6 py-0">
    <nav class="flex gap-1 overflow-x-auto" aria-label="{% trans 'Storage Management Navigation' %}">

      <a href="{% url 'storage_providers' %}"
         class="inline-flex items-center gap-2 px-4 py-3.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap
                {% block subnav_providers %}border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300{% endblock %}">
        <i data-lucide="hard-drive" class="w-4 h-4"></i>
        {% trans "Providers" %}
      </a>

      <a href="{% url 'storage_org_policies' %}"
         class="inline-flex items-center gap-2 px-4 py-3.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap
                {% block subnav_org_policies %}border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300{% endblock %}">
        <i data-lucide="building-2" class="w-4 h-4"></i>
        {% trans "Org Policies" %}
      </a>

      <a href="{% url 'storage_file_policies' %}"
         class="inline-flex items-center gap-2 px-4 py-3.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap
                {% block subnav_file_policies %}border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300{% endblock %}">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        {% trans "File Policies" %}
      </a>

      <a href="{% url 'storage_file_monitor' %}"
         class="inline-flex items-center gap-2 px-4 py-3.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap
                {% block subnav_file_monitor %}border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300{% endblock %}">
        <i data-lucide="folder-search" class="w-4 h-4"></i>
        {% trans "File Monitor" %}
      </a>

    </nav>
  </div>

  <!-- Page content area -->
  <div class="flex-1 overflow-y-auto p-6">
    {% block storage_content %}{% endblock %}
  </div>

</div>
{% endblock %}
