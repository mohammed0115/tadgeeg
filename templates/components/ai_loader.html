{% load i18n %}
{% comment %}
AI Loader markup — core animated brain + rings + particles.
Caller wraps this in their own status text + stages strip.
The CSS lives in dashboard_base.html / each standalone page.
{% endcomment %}
<div class="ai-loader-core">
  <div class="ai-loader-glow"></div>

  <div class="ai-loader-ring ai-loader-ring--1"></div>
  <div class="ai-loader-ring ai-loader-ring--2"></div>
  <div class="ai-loader-ring ai-loader-ring--3"></div>

  <div class="ai-loader-orbit">
    <div class="ai-loader-particle ai-loader-particle--top"></div>
    <div class="ai-loader-particle ai-loader-particle--bottom"></div>
  </div>
  <div class="ai-loader-orbit ai-loader-orbit--reverse">
    <div class="ai-loader-particle ai-loader-particle--right"></div>
    <div class="ai-loader-particle ai-loader-particle--left"></div>
  </div>

  <div class="ai-loader-center">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.793a3 3 0 0 0-3 2.957v.5a3 3 0 0 0 .5 1.66A3 3 0 0 0 4 12.5a3 3 0 0 0 1.5 2.59 3 3 0 0 0 1.5 4.41V20.5A2.5 2.5 0 0 0 9.5 23h.5a2.5 2.5 0 0 0 2-1V3a2.5 2.5 0 0 0-2-1h-.5z"/>
      <path d="M14.5 2a2.5 2.5 0 0 1 2.5 2.5v.793a3 3 0 0 1 3 2.957v.5a3 3 0 0 1-.5 1.66A3 3 0 0 1 20 12.5a3 3 0 0 1-1.5 2.59 3 3 0 0 1-1.5 4.41V20.5a2.5 2.5 0 0 1-2.5 2.5h-.5a2.5 2.5 0 0 1-2-1"/>
    </svg>
  </div>
</div>
