{% extends "layouts/base_vendor_dashboard.html" %}
{% load i18n %}
{% block page_title %}التخزين{% endblock %}
{% block breadcrumb_current %}التخزين{% endblock %}

{% block content %}
<div x-data="storageStats()" x-init="init()" class="space-y-6 fade-in">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">التخزين</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">إحصائيات ومعلومات استخدام مساحة التخزين</p>
    </div>
    <a href="/dashboard/billing/" class="btn-ghost text-xs">
      <i data-lucide="credit-card" class="w-4 h-4"></i>
      ترقية الخطة
    </a>
  </div>

  <!-- Loading -->
  <template x-if="loading">
    <div class="animate-pulse space-y-4">
      <div class="card p-6 space-y-3">
        <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
        <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
      </div>
    </div>
  </template>

  <template x-if="!loading">
    <div class="space-y-6">

      <!-- Main Usage Card -->
      <div class="card p-6 space-y-5">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="hard-drive" class="w-5 h-5 text-blue-500"></i>
            الاستخدام الإجمالي
          </h3>
          <span class="badge"
                :class="{
                  'badge-green':  (stats.storage_percent || 0) < 60,
                  'badge-amber':  (stats.storage_percent || 0) >= 60 && (stats.storage_percent || 0) < 85,
                  'badge-red':    (stats.storage_percent || 0) >= 85,
                }"
                x-text="(stats.storage_percent || 0) + '% مستخدم'"></span>
        </div>
        <div>
          <div class="flex items-center justify-between text-sm mb-2">
            <span class="text-slate-500" x-text="stats.storage_used_human || '0 MB'"></span>
            <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="'من ' + (stats.storage_limit_human || '1 GB')"></span>
          </div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-700"
                 :class="{
                   'bg-blue-500':   (stats.storage_percent || 0) < 60,
                   'bg-amber-500':  (stats.storage_percent || 0) >= 60 && (stats.storage_percent || 0) < 85,
                   'bg-red-500':    (stats.storage_percent || 0) >= 85,
                 }"
                 :style="'width:' + Math.min(stats.storage_percent || 0, 100) + '%'"></div>
          </div>
          <template x-if="(stats.storage_percent || 0) >= 85">
            <p class="text-xs text-red-500 mt-2 flex items-center gap-1">
              <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
              مساحة التخزين تقترب من الحد الأقصى. يُنصح بترقية خطتك.
            </p>
          </template>
        </div>
      </div>

      <!-- Breakdown by Type -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <template x-for="item in (stats.breakdown || [])" :key="item.type">
          <div class="card p-5">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center" :style="'background:' + item.bg_color + '20'">
                <i :data-lucide="item.icon || 'file'" class="w-5 h-5" :style="'color:' + item.color"></i>
              </div>
              <p class="text-xs font-semibold text-slate-500 uppercase" x-text="item.label_ar || item.type"></p>
            </div>
            <p class="text-2xl font-black text-slate-900 dark:text-white" x-text="item.size_human"></p>
            <div class="flex items-center justify-between mt-2">
              <p class="text-xs text-slate-400" x-text="(item.files_count || 0) + ' ملف'"></p>
              <p class="text-xs text-slate-400" x-text="(item.percent || 0) + '%'"></p>
            </div>
            <div class="progress-track mt-2">
              <div class="progress-fill" :style="'width:' + (item.percent || 0) + '%; background:' + item.color"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Largest Files -->
      <div class="card overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/30 flex items-center justify-between">
          <h3 class="text-sm font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="files" class="w-4 h-4 text-blue-500"></i>
            أكبر الملفات
          </h3>
          <a href="/dashboard/files/" class="text-xs text-blue-600 dark:text-blue-400 hover:underline">عرض الكل</a>
        </div>
        <template x-if="largestFiles.length === 0">
          <div class="px-5 py-10 text-center text-slate-400 text-sm">لا توجد ملفات بعد</div>
        </template>
        <div class="divide-y divide-slate-100 dark:divide-slate-700/30">
          <template x-for="file in largestFiles" :key="file.id">
            <div class="px-5 py-3.5 flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-slate-50 dark:bg-slate-700/40 flex items-center justify-center flex-shrink-0">
                <i :data-lucide="file.file_type === 'pdf' ? 'file-text' : file.file_type === 'excel' ? 'table-2' : 'file'"
                   class="w-4 h-4 text-slate-500"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-slate-700 dark:text-slate-300 truncate"
                   x-text="file.original_name || file.name"></p>
                <p class="text-xs text-slate-400" x-text="file.created_at ? new Date(file.created_at).toLocaleDateString('ar-SA') : ''"></p>
              </div>
              <span class="text-sm font-bold text-slate-600 dark:text-slate-400 flex-shrink-0" x-text="file.size_human"></span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

</div>
{% endblock %}

{% block extra_js %}
<script>
function storageStats() {
  return {
    stats: {}, largestFiles: [], loading: true,

    async init() {
      try {
        const [statsRes, filesRes] = await Promise.all([
          apiFetch('/api/v1/vendor/storage/stats/'),
          apiFetch('/api/v1/documents/?ordering=-size&page_size=10'),
        ]);
        if (statsRes && statsRes.ok) this.stats = await statsRes.json();
        if (filesRes && filesRes.ok) {
          const data = await filesRes.json();
          this.largestFiles = Array.isArray(data) ? data : (data.results || []);
        }
      } catch (e) {
        notify('تعذّر تحميل إحصائيات التخزين', 'error');
      } finally {
        this.loading = false;
        this.$nextTick(() => lucide.createIcons());
      }
    },
  };
}
</script>
{% endblock %}
