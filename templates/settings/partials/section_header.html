<div class="flex flex-col gap-4 border-b border-slate-200/80 pb-5 dark:border-slate-800 md:flex-row md:items-start md:justify-between">
  <div class="flex items-start gap-4">
    <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl {{ icon_wrap_class|default:'bg-primary-50 text-primary-700 dark:bg-primary-500/10 dark:text-primary-200' }}">
      <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
    </span>
    <div class="space-y-1.5">
      {% if eyebrow %}
      <p class="text-[11px] font-semibold uppercase tracking-[0.24em] text-slate-400 dark:text-slate-500">{{ eyebrow }}</p>
      {% endif %}
      <div class="flex flex-wrap items-center gap-3">
        <h2 class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white sm:text-2xl">{{ title }}</h2>
        {% if badge_text %}
        <span class="inline-flex items-center rounded-full border px-3 py-1 text-xs font-semibold {{ badge_class|default:'border-slate-200 bg-slate-50 text-slate-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300' }}">
          {{ badge_text }}
        </span>
        {% endif %}
      </div>
      {% if description %}
      <p class="max-w-3xl text-sm leading-7 text-slate-600 dark:text-slate-400">{{ description }}</p>
      {% endif %}
    </div>
  </div>

  {% if aside %}
  <div class="max-w-xs rounded-2xl border border-slate-200 bg-slate-50/80 px-4 py-3 text-xs leading-6 text-slate-500 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-400">
    {{ aside }}
  </div>
  {% endif %}
</div>
