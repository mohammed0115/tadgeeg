        '200':
          description: No response body
  /api/v1/analytics/anomalies/detect/:
    post:
      operationId: api_v1_analytics_anomalies_detect_create
      description: Run AI anomaly detection on organizational transactions.
      summary: Detect anomalies in financial transactions using AI
      tags:
      - Analytics
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              date_from:
                type: string
                format: date
              date_to:
                type: string
                format: date
              transaction_types:
                type: array
                items:
                  type: string
              min_amount:
                type: number
              max_amount:
                type: number
              auto_create_cases:
                type: boolean
                default: true
      security:
      - JWTCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/benchmark/:
    get:
      operationId: api_v1_analytics_benchmark_retrieve
      description: |-
        FR-10 gap fix: Compare organization metrics against Saudi industry benchmarks.
        Benchmark data curated from ZATCA reports, SOCPA guidelines, and Big Four
        published Saudi market data (2024-2025).
        GET /api/v1/analytics/benchmark/?industry=finance
      summary: Compare organization metrics against Saudi industry benchmarks (FR-10)
      parameters:
      - in: query
        name: industry
        schema:
          type: string
        description: 'Industry key: finance|retail|construction|healthcare|manufacturing|services.
          Auto-detected from organization.industry if omitted.'
      tags:
      - Analytics
      security:
      - JWTCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/benford/:
