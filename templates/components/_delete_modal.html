{% load i18n %}

<!-- ✅ Reusable Delete Confirmation Modal -->
<div id="deleteConfirmationModal" class="modal hidden" style="display: none;">
  <div class="modal-overlay" onclick="closeDeleteModal()"></div>
  <div class="modal-dialog">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <!-- Modal Header -->
      <div class="modal-header bg-gradient-to-r from-red-50 to-red-100 border-b border-red-200 px-6 py-4">
        <div class="flex items-center gap-3">
          <svg class="w-6 h-6 text-red-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <h2 class="text-xl font-bold text-red-900">{% trans "Confirm Delete" %}</h2>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body px-6 py-4 space-y-4">
        <p class="text-slate-700 font-medium">
          {% trans "Are you sure you want to delete" %} <span class="font-bold text-slate-900" id="deleteItemName"></span>?
        </p>
        
        <div class="bg-red-50 border border-red-200 rounded-lg p-3 flex gap-3">
          <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <p class="text-sm text-red-800">
            {% trans "This action cannot be undone. The item will be marked as deleted." %}
          </p>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer bg-slate-50 border-t border-slate-200 px-6 py-4 flex items-center justify-end gap-3">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">
          {% trans "Cancel" %}
        </button>
        <button class="btn btn-danger" id="confirmDeleteBtn" onclick="executeDelete()">
          <svg class="w-4 h-4 inline mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          {% trans "Delete Permanently" %}
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal.hidden {
  display: none;
}

.modal-overlay {
  position: absolute;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  cursor: pointer;
}

.modal-dialog {
  position: relative;
  z-index: 10;
  max-width: 28rem;
  width: 100%;
  margin: 0 auto;
}

.modal-content {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 3.5rem);
  overflow-y: auto;
  animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(1rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-header, .modal-body, .modal-footer {
  flex: 0 0 auto;
}

.modal-body {
  flex: 1 1 auto;
}

.btn {
  display: inline-flex;
  align-items: center;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-weight: 500;
  font-size: 0.875rem;
  transition: all 0.3s ease;
  border: none;
  cursor: pointer;
}

.btn-secondary {
  background-color: #e2e8f0;
  color: #334155;
}

.btn-secondary:hover {
  background-color: #cbd5e1;
}

.btn-danger {
  background-color: #ef4444;
  color: white;
}

.btn-danger:hover {
  background-color: #dc2626;
}

.btn-danger:disabled {
  background-color: #fed7d7;
  cursor: not-allowed;
}
</style>

<script>
let deleteContext = {
  type: null,
  id: null,
  name: null,
  redirectUrl: null
};

function openDeleteModal(itemType, itemId, itemName, redirectOn Success = null) {
  deleteContext = {
    type: itemType,
    id: itemId,
    name: itemName,
    redirectUrl: redirectOnSuccess
  };

  const modal = document.getElementById('deleteConfirmationModal');
  const nameSpan = document.getElementById('deleteItemName');
  const confirmBtn = document.getElementById('confirmDeleteBtn');

  nameSpan.textContent = itemName;
  confirmBtn.disabled = false;
  confirmBtn.textContent = '{% trans "Delete Permanently" %}';

  modal.classList.remove('hidden');
  modal.style.display = 'flex';
}

function closeDeleteModal() {
  const modal = document.getElementById('deleteConfirmationModal');
  modal.classList.add('hidden');
  modal.style.display = 'none';
  deleteContext = { type: null, id: null, name: null, redirectUrl: null };
}

async function executeDelete() {
  if (!deleteContext.id || !deleteContext.type) return;

  const confirmBtn = document.getElementById('confirmDeleteBtn');
  confirmBtn.disabled = true;
  confirmBtn.innerHTML = '<span class="spinner"></span> {% trans "Deleting..." %}';

  try {
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                      document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];

    let endpoint;
    switch (deleteContext.type) {
      case 'invoice':
        endpoint = `/api/v1/invoices/${deleteContext.id}/`;
        break;
      case 'document':
        endpoint = `/api/v1/documents/${deleteContext.id}/`;
        break;
      case 'report':
        endpoint = `/api/v1/reports/${deleteContext.id}/`;
        break;
      case 'audit':
        endpoint = `/api/v1/audit-cases/${deleteContext.id}/`;
        break;
      default:
        throw new Error('Unknown delete type');
    }

    const response = await fetch(endpoint, {
      method: 'DELETE',
      headers: {
        'X-CSRFToken': csrfToken
      }
    });

    if (response.ok) {
      closeDeleteModal();
      
      if (deleteContext.redirectUrl) {
        window.location.href = deleteContext.redirectUrl;
      } else {
        // Show success message
        showSuccessNotification(`${deleteContext.type} deleted successfully`);
        // Reload page after 2 seconds
        setTimeout(() => location.reload(), 2000);
      }
    } else {
      const error = await response.json();
      showErrorNotification(error.detail || 'Failed to delete item');
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '{% trans "Delete Permanently" %}';
    }
  } catch (error) {
    console.error('Delete error:', error);
    showErrorNotification('An error occurred while deleting');
    confirmBtn.disabled = false;
    confirmBtn.innerHTML = '{% trans "Delete Permanently" %}';
  }
}

function showSuccessNotification(message) {
  const notification = document.createElement('div');
  notification.className = 'notification notification-success';
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => notification.remove(), 3000);
}

function showErrorNotification(message) {
  const notification = document.createElement('div');
  notification.className = 'notification notification-error';
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => notification.remove(), 3000);
}

// Close modal on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDeleteModal();
});
</script>
