  /api/v1/documents/upload/:
    post:
      operationId: api_v1_documents_upload_create
      description: |-
        Upload a financial document.

        Accepts: PDF, PNG, JPG, JPEG, TIFF, ZIP, XLSX, CSV, JSON (up to 50 MB; ZIP up to 200 MB).

        The document is saved immediately and queued for async processing via Celery.
        The full pipeline (OCR → AI extraction → fraud/dup detection → audit rules) runs
        in the background.  Poll GET /api/documents/{pk}/ to monitor processing_status.

        Processing status lifecycle:
          pending → processing → completed | needs_review | failed
      summary: Upload a financial document (PDF/image/ZIP/Excel/CSV/JSON)
      tags:
      - Documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
        required: true
      security:
      - JWTCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/v1/documents/upload/typed/:
    post:
      operationId: api_v1_documents_upload_typed_create
      description: |-
        Universal upload endpoint for all 7 financial document types.
        Detects type from `document_type` field, routes to correct pipeline.
      summary: رفع وتحليل الوثائق المالية (أوامر شراء / كشوف بنكية / رواتب / مصروفات
        / ضريبة / أصول / إيصالات)
      tags:
      - Documents
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              files:
                type: array
                items:
                  type: string
                  format: binary
              document_type:
                type: string
                enum:
                - purchase_order
                - bank_statement
                - payroll
                - expense_report
                - vat_return
                - fixed_asset
                - sales_receipt
                - grn
                - payment
                - invoice
      security:
      - JWTCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
