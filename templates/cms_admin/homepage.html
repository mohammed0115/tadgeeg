{% extends "cms_admin/base_cms.html" %}
{% load i18n %}

{% block title %}{% trans "Homepage Editor" %}{% endblock %}
{% block page_title %}{% trans "Platform CMS" %}{% endblock %}
{% block tab_homepage %}active{% endblock %}

{% block cms_content %}
<div x-data="homepageEditor()" x-init="init()" class="space-y-5">

  <!-- Section Tab Bar -->
  <div class="card p-1 flex gap-1 flex-wrap">
    <template x-for="tab in tabs" :key="tab.id">
      <button @click="activeTab = tab.id; $nextTick(() => lucide.createIcons())"
              class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-medium transition-all"
              :class="activeTab === tab.id
                ? 'bg-primary-600 text-white shadow-sm'
                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'">
        <i :data-lucide="tab.icon" class="w-3.5 h-3.5"></i>
        <span x-text="tab.label"></span>
      </button>
    </template>
  </div>

  <!-- Loading Skeleton -->
  <template x-if="loading">
    <div class="animate-pulse space-y-3">
      <div class="h-10 bg-slate-200 dark:bg-slate-700 rounded-xl w-full"></div>
      <div class="h-10 bg-slate-200 dark:bg-slate-700 rounded-xl w-3/4"></div>
      <div class="h-32 bg-slate-200 dark:bg-slate-700 rounded-xl w-full"></div>
    </div>
  </template>

  <template x-if="!loading">
    <div>

      <!-- Tab 1: Hero Section -->
      <div x-show="activeTab === 'hero'" class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
          <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
          {% trans "Hero Section" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Hero Title" %} <span class="text-blue-500">(EN)</span></label>
            <input type="text" x-model="form.hero.hero_title" class="input" placeholder="Intelligent Financial Auditing">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Hero Title" %} <span class="text-emerald-500">(عربي)</span></label>
            <input type="text" x-model="form.hero.hero_title_ar" class="input" dir="rtl" placeholder="تدقيق مالي ذكي">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Hero Subtitle" %} <span class="text-blue-500">(EN)</span></label>
            <textarea x-model="form.hero.hero_subtitle" class="input" rows="2" placeholder="Automate compliance..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Hero Subtitle" %} <span class="text-emerald-500">(عربي)</span></label>
            <textarea x-model="form.hero.hero_subtitle_ar" class="input" rows="2" dir="rtl" placeholder="أتمتة الامتثال..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "CTA Primary Text" %} (EN)</label>
            <input type="text" x-model="form.hero.cta_primary_text" class="input" placeholder="Get Started Free">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "CTA Primary URL" %}</label>
            <input type="url" x-model="form.hero.cta_primary_url" class="input" placeholder="/register/">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "CTA Secondary Text" %} (EN)</label>
            <input type="text" x-model="form.hero.cta_secondary_text" class="input" placeholder="Watch Demo">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "CTA Secondary URL" %}</label>
            <input type="url" x-model="form.hero.cta_secondary_url" class="input" placeholder="/demo/">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Hero Image URL" %}</label>
            <input type="url" x-model="form.hero.hero_image_url" class="input" placeholder="https://...">
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('hero')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save Hero" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 2: Stats -->
      <div x-show="activeTab === 'stats'" class="card p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-blue-500"></i>
            {% trans "Stats" %}
          </h3>
          <button @click="addStat()" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Stat" %}
          </button>
        </div>
        <div class="space-y-3">
          <template x-for="(stat, idx) in form.stats" :key="idx">
            <div class="flex items-start gap-3 p-4 bg-slate-50 dark:bg-slate-700/30 rounded-xl">
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3 flex-1">
                <input type="text" x-model="stat.label" class="input" placeholder="{% trans "Label EN" %}">
                <input type="text" x-model="stat.label_ar" class="input" dir="rtl" placeholder="التسمية">
                <input type="text" x-model="stat.value" class="input" placeholder="10,000+">
                <input type="text" x-model="stat.icon" class="input" placeholder="users">
              </div>
              <button @click="form.stats.splice(idx, 1)" class="text-slate-400 hover:text-red-500 mt-2 flex-shrink-0">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </template>
          <template x-if="form.stats.length === 0">
            <p class="text-sm text-slate-400 text-center py-4">{% trans "No stats yet. Click Add Stat." %}</p>
          </template>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('stats')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save Stats" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 3: Trusted By -->
      <div x-show="activeTab === 'trusted'" class="card p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="award" class="w-4 h-4 text-amber-500"></i>
            {% trans "Trusted By" %}
          </h3>
          <button @click="form.trusted_logos.push({name:'',logo_url:''})" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Logo" %}
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <template x-for="(logo, idx) in form.trusted_logos" :key="idx">
            <div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl">
              <template x-if="logo.logo_url">
                <img :src="logo.logo_url" class="w-10 h-10 object-contain rounded" alt="">
              </template>
              <template x-if="!logo.logo_url">
                <div class="w-10 h-10 rounded bg-slate-200 dark:bg-slate-600 flex items-center justify-center">
                  <i data-lucide="image" class="w-5 h-5 text-slate-400"></i>
                </div>
              </template>
              <div class="flex-1 space-y-2">
                <input type="text" x-model="logo.name" class="input" placeholder="{% trans "Company Name" %}">
                <input type="url" x-model="logo.logo_url" class="input" placeholder="https://...logo.svg">
              </div>
              <button @click="form.trusted_logos.splice(idx, 1)" class="text-slate-400 hover:text-red-500 flex-shrink-0">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </template>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('trusted_logos')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 4: Intro Video -->
      <div x-show="activeTab === 'video'" class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
          <i data-lucide="play-circle" class="w-4 h-4 text-violet-500"></i>
          {% trans "Intro Video" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Video URL" %}</label>
            <input type="url" x-model="form.video.video_url" class="input" placeholder="https://youtube.com/...">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Thumbnail URL" %}</label>
            <input type="url" x-model="form.video.thumbnail_url" class="input" placeholder="https://...thumbnail.jpg">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (EN)</label>
            <input type="text" x-model="form.video.title" class="input" placeholder="See How It Works">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (عربي)</label>
            <input type="text" x-model="form.video.title_ar" class="input" dir="rtl" placeholder="شاهد كيف يعمل">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Description" %} (EN)</label>
            <textarea x-model="form.video.description" class="input" rows="3"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Description" %} (عربي)</label>
            <textarea x-model="form.video.description_ar" class="input" rows="3" dir="rtl"></textarea>
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('video')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save Video" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 5: About Section -->
      <div x-show="activeTab === 'about_section'" class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
          <i data-lucide="info" class="w-4 h-4 text-blue-500"></i>
          {% trans "About Section" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (EN)</label>
            <input type="text" x-model="form.about_section.title" class="input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Title" %} (عربي)</label>
            <input type="text" x-model="form.about_section.title_ar" class="input" dir="rtl">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Subtitle" %} (EN)</label>
            <input type="text" x-model="form.about_section.subtitle" class="input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Subtitle" %} (عربي)</label>
            <input type="text" x-model="form.about_section.subtitle_ar" class="input" dir="rtl">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Content" %} (EN)</label>
            <textarea x-model="form.about_section.content" class="input" rows="4"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Content" %} (عربي)</label>
            <textarea x-model="form.about_section.content_ar" class="input" rows="4" dir="rtl"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Mission" %} (EN)</label>
            <textarea x-model="form.about_section.mission" class="input" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Vision" %} (EN)</label>
            <textarea x-model="form.about_section.vision" class="input" rows="2"></textarea>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Image URL" %}</label>
            <input type="url" x-model="form.about_section.image_url" class="input">
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('about_section')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 6: Core Values -->
      <div x-show="activeTab === 'values'" class="card p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i data-lucide="heart" class="w-4 h-4 text-red-500"></i>
            {% trans "Core Values" %}
          </h3>
          <button @click="form.core_values.push({title:'',title_ar:'',description:'',icon:''})" class="btn-ghost text-xs">
            <i data-lucide="plus" class="w-4 h-4"></i> {% trans "Add Value" %}
          </button>
        </div>
        <div class="space-y-3">
          <template x-for="(val, idx) in form.core_values" :key="idx">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/30 rounded-xl space-y-3">
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <input type="text" x-model="val.title" class="input" placeholder="{% trans "Title EN" %}">
                <input type="text" x-model="val.title_ar" class="input" dir="rtl" placeholder="العنوان">
                <input type="text" x-model="val.description" class="input" placeholder="{% trans "Description" %}">
                <div class="flex items-center gap-2">
                  <input type="text" x-model="val.icon" class="input flex-1" placeholder="shield-check">
                  <template x-if="val.icon">
                    <span class="flex-shrink-0 w-8 h-8 rounded-lg bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center">
                      <i :data-lucide="val.icon" class="w-4 h-4 text-primary-600 dark:text-primary-400"></i>
                    </span>
                  </template>
                </div>
              </div>
              <div class="flex justify-end">
                <button @click="form.core_values.splice(idx, 1)" class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> {% trans "Remove" %}
                </button>
              </div>
            </div>
          </template>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('core_values')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save Values" %}'"></span>
          </button>
        </div>
      </div>

      <!-- Tab 7: SEO -->
      <div x-show="activeTab === 'seo'" class="card p-6 space-y-5">
        <h3 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
          <i data-lucide="search" class="w-4 h-4 text-emerald-500"></i>
          {% trans "Homepage SEO" %}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Meta Title" %} (EN) <span class="text-slate-400" x-text="'(' + (form.seo.meta_title||'').length + '/60)'"></span></label>
            <input type="text" x-model="form.seo.meta_title" class="input" maxlength="60">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Meta Title" %} (عربي)</label>
            <input type="text" x-model="form.seo.meta_title_ar" class="input" dir="rtl">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "Meta Description" %} (EN) <span class="text-slate-400" x-text="'(' + (form.seo.meta_description||'').length + '/160)'"></span></label>
            <textarea x-model="form.seo.meta_description" class="input" rows="3" maxlength="160"></textarea>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">{% trans "OG Image URL" %}</label>
            <input type="url" x-model="form.seo.og_image" class="input">
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button @click="saveSection('seo')" :disabled="saving" class="btn-primary">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="saving ? '{% trans "Saving..." %}' : '{% trans "Save SEO" %}'"></span>
          </button>
        </div>
      </div>

    </div>
  </template>

</div>
{% endblock %}

{% block page_js %}
<script>
function homepageEditor() {
  return {
    loading: true,
    saving: false,
    activeTab: 'hero',
    tabs: [
      { id: 'hero',          label: '{% trans "Hero" %}',         icon: 'star' },
      { id: 'stats',         label: '{% trans "Stats" %}',        icon: 'bar-chart-2' },
      { id: 'trusted',       label: '{% trans "Trusted By" %}',   icon: 'award' },
      { id: 'video',         label: '{% trans "Video" %}',        icon: 'play-circle' },
      { id: 'about_section', label: '{% trans "About" %}',        icon: 'info' },
      { id: 'values',        label: '{% trans "Core Values" %}',  icon: 'heart' },
      { id: 'seo',           label: '{% trans "SEO" %}',          icon: 'search' },
    ],
    form: {
      hero: { hero_title:'', hero_title_ar:'', hero_subtitle:'', hero_subtitle_ar:'', cta_primary_text:'', cta_primary_url:'', cta_secondary_text:'', cta_secondary_url:'', hero_image_url:'' },
      stats: [],
      trusted_logos: [],
      video: { video_url:'', thumbnail_url:'', title:'', title_ar:'', description:'', description_ar:'' },
      about_section: { title:'', title_ar:'', subtitle:'', subtitle_ar:'', content:'', content_ar:'', mission:'', vision:'', image_url:'' },
      core_values: [],
      seo: { meta_title:'', meta_title_ar:'', meta_description:'', og_image:'' },
    },

    async init() {
      try {
        const data = await apiFetch('/api/v1/cms/admin/homepage/');
        if (data) {
          if (data.hero) Object.assign(this.form.hero, data.hero);
          if (data.stats) this.form.stats = data.stats;
          if (data.trusted_logos) this.form.trusted_logos = data.trusted_logos;
          if (data.video) Object.assign(this.form.video, data.video);
          if (data.about_section) Object.assign(this.form.about_section, data.about_section);
          if (data.core_values) this.form.core_values = data.core_values;
          if (data.seo) Object.assign(this.form.seo, data.seo);
        }
      } catch (e) {
        notify('{% trans "Failed to load homepage data" %}', 'error');
      } finally {
        this.loading = false;
        this.$nextTick(() => lucide.createIcons());
      }
    },

    addStat() {
      this.form.stats.push({ label: '', label_ar: '', value: '', icon: '' });
    },

    async saveSection(section) {
      this.saving = true;
      try {
        await apiFetch('/api/v1/cms/admin/homepage/', {
          method: 'PATCH',
          body: JSON.stringify({ section, data: this.form[section] }),
        });
        notify('{% trans "Saved successfully" %}', 'success');
      } catch (e) {
        notify(e.message || '{% trans "Failed to save" %}', 'error');
      } finally {
        this.saving = false;
      }
    },
  };
}
</script>
{% endblock %}
