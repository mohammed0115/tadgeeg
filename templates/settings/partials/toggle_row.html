<div @click="{{ toggle_model }} = !{{ toggle_model }}"
     class="flex cursor-pointer items-start justify-between gap-4 rounded-2xl border border-slate-200/80 bg-slate-50/70 px-4 py-4 transition duration-200 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/30 dark:hover:border-slate-700 dark:hover:bg-slate-950/50">
  <div class="space-y-1">
    <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ label }}</p>
    {% if description %}
    <p class="text-xs leading-6 text-slate-500 dark:text-slate-400">{{ description }}</p>
    {% endif %}
  </div>

  <button type="button"
          role="switch"
          @click.stop="{{ toggle_model }} = !{{ toggle_model }}"
          :aria-checked="{{ toggle_model }} ? 'true' : 'false'"
          class="relative mt-0.5 inline-flex h-6 w-11 shrink-0 rounded-full transition duration-200 focus:outline-none focus:ring-4 focus:ring-primary-500/20"
          :class="{{ toggle_model }} ? 'bg-primary-600 shadow-lg shadow-primary-500/20' : 'bg-slate-300 dark:bg-slate-700'">
    <span class="absolute inset-y-0.5 right-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform duration-200"
          :class="{{ toggle_model }} ? '-translate-x-5' : 'translate-x-0'"></span>
  </button>
</div>
