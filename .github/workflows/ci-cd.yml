name: FinAI CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Lint & Test ──────────────────────────────────────────────────────────

  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint, Test & Coverage

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: finai_test
          MYSQL_USER: finai_test
          MYSQL_PASSWORD: ci_pass
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pci_root --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            pkg-config \
            libmagic1 \
            tesseract-ocr \
            tesseract-ocr-ara \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest with coverage (MySQL)
        env:
          DJANGO_SETTINGS_MODULE: finai_backend.settings
          DEBUG: "True"
          SECRET_KEY: ci-only-insecure-key-not-used-in-prod
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: finai_test
          DB_USER: finai_test
          DB_PASSWORD: ci_pass
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
          LOG_FORMAT: text
        run: |
          pytest tests/ \
            --cov=apps \
            --cov=core \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=40 \
            -v \
            --tb=short \
            -x

      - name: Run flake8 (non-blocking)
        run: flake8 apps core --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ─── Security Scan ────────────────────────────────────────────────────────

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.5 safety==3.2.0

      - name: Bandit — static security analysis
        run: bandit -r apps core -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Safety — known CVE check
        run: safety check -r requirements.txt --json -o safety-report.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ─── Migration Integrity Check ────────────────────────────────────────────

  migrations-check:
    runs-on: ubuntu-latest
    name: Migration Integrity Check

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: finai_ci
          MYSQL_USER: finai_ci
          MYSQL_PASSWORD: ci_pass
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pci_root --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config libmagic1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations (dry-run)
        env:
          DJANGO_SETTINGS_MODULE: finai_backend.settings
          DEBUG: "True"
          SECRET_KEY: ci-only-insecure-key
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: finai_ci
          DB_USER: finai_ci
          DB_PASSWORD: ci_pass
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          SENTRY_DSN: ""
        run: python manage.py makemigrations --check --dry-run

      - name: Apply all migrations against MySQL
        env:
          DJANGO_SETTINGS_MODULE: finai_backend.settings
          DEBUG: "True"
          SECRET_KEY: ci-only-insecure-key
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: finai_ci
          DB_USER: finai_ci
          DB_PASSWORD: ci_pass
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          SENTRY_DSN: ""
        run: python manage.py migrate --run-syncdb

  # ─── Build Docker Image ───────────────────────────────────────────────────

  build-docker:
    needs: [lint-and-test, security-scan, migrations-check]
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    permissions:
      contents: read
      packages: write

    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Dev ────────────────────────────────────────────────────────

  deploy-dev:
    needs: build-docker
    runs-on: ubuntu-latest
    name: Deploy → Dev

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            "cd /apps/tadgeeg && git pull origin dev && docker compose up -d --pull always"

      - name: Smoke test
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          sleep 20
          curl -fsS "$STAGING_URL/health/" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)"

  # ─── Deploy to Production ─────────────────────────────────────────────────

  deploy-production:
    needs: build-docker
    runs-on: ubuntu-latest
    name: Deploy → Production

    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'

    environment:
      name: production
      url: ${{ secrets.PROD_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "cd /apps/tadgeeg && git pull origin main && docker compose up -d --pull always && docker compose exec web python manage.py migrate --no-input"

      - name: Production health check
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          sleep 30
          curl -fsS "$PROD_URL/health/" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)"
          curl -fsS "$PROD_URL/health/full/" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status') in ('ok','degraded') else 1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
