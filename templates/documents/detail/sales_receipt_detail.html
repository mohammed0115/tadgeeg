{%  extends "base.html" %}
{%  block title %}تفاصيل إيصال البيع{%  endblock %}
{%  block page_title %}تفاصيل إيصال البيع{%  endblock %}

{%  block content %}
<div x-data="docDetail()" x-init="load()">

  <a href="/documents/sales-receipts/" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-primary-600 dark:hover:text-primary-400 mb-5 transition-colors">
    <i data-lucide="arrow-right" class="w-4 h-4"></i> العودة للقائمة
  </a>

  <template x-if="loading">
    <div class="card p-12 text-center text-slate-400"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto"></i></div>
  </template>

  <template x-if="doc && !loading">
    <div class="space-y-5">

      <!-- Header -->
      <div class="card p-6">
        <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
          <div>
            <div class="flex items-center gap-3 mb-2">
              <div class="w-9 h-9 rounded-xl bg-primary-100 dark:bg-primary-900/40 flex items-center justify-center">
                <i data-lucide="scan-line" class="w-5 h-5 text-primary-600"></i>
              </div>
              <span class="text-sm text-slate-400">تفاصيل إيصال البيع</span>
              <span :class="riskBadge(doc.risk_level)" class="text-xs font-bold px-2.5 py-1 rounded-lg border" x-text="riskLabel(doc.risk_level)"></span>
              <span :class="statusBadge(doc.audit_status)" class="text-xs font-semibold px-2.5 py-1 rounded-lg border" x-text="statusLabel(doc.audit_status)"></span>
            </div>
            <h1 class="text-lg font-bold text-slate-800 dark:text-white" x-text="docTitle"></h1>
            <p class="text-xs text-slate-400 mt-1" x-text="'رُفع: ' + fmtDate(doc.created_at)"></p>
          </div>
          <div class="flex gap-2">
            <template x-if="doc.audit_status !== 'approved'">
              <button @click="approve()" :disabled="saving" class="btn-primary text-sm px-4 h-9 rounded-xl flex items-center gap-2 disabled:opacity-50">
                <i data-lucide="check" class="w-4 h-4"></i> اعتماد
              </button>
            </template>
          </div>
        </div>

        <!-- Score bar -->
        <div class="flex items-center gap-3">
          <p class="text-xs text-slate-400 w-24">نقاط التحقق</p>
          <div class="flex-1 bg-slate-200 dark:bg-slate-700 rounded-full h-3">
            <div class="h-3 rounded-full transition-all" :class="scoreColor(doc.validation_score)"
                 :style="'width:' + (doc.validation_score||0) + '%'"></div>
          </div>
          <span class="font-mono font-bold text-slate-700 dark:text-slate-200" x-text="(doc.validation_score||0).toFixed(1) + '%'"></span>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

        <!-- Main fields -->
        <div class="lg:col-span-2 space-y-5">

          <!-- Key fields -->
          <div class="card p-5">
            <h3 class="font-bold text-slate-800 dark:text-white mb-4 text-sm flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4 text-primary-500"></i>
              البيانات المستخرجة
            </h3>
            <div class="grid grid-cols-2 gap-3">
              <template x-for="[k,v] in fields" :key="k">
                <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-3">
                  <p class="text-xs text-slate-400 mb-0.5" x-text="k"></p>
                  <p class="text-sm font-semibold text-slate-700 dark:text-slate-200 break-all" x-text="v || '—'"></p>
                </div>
              </template>
            </div>
          </div>

          <!-- Line items / entries JSON table (if exists) -->
          <template x-if="lineItems && lineItems.length > 0">
            <div class="card p-5">
              <h3 class="font-bold text-slate-800 dark:text-white mb-4 text-sm flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4 text-primary-500"></i>
                التفاصيل (بنود الإيصال)
              </h3>
              <div class="overflow-x-auto">
                <table class="w-full text-xs">
                  <thead>
                    <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
                      <template x-for="col in itemCols" :key="col">
                        <th class="text-right px-3 py-2 font-semibold" x-text="col"></th>
                      </template>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(item, i) in lineItems" :key="i">
                      <tr class="border-b border-slate-100 dark:border-slate-700/50">
                        <template x-for="col in itemKeys" :key="col">
                          <td class="px-3 py-2 text-slate-600 dark:text-slate-300" x-text="item[col] ?? '—'"></td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <!-- AI Summary -->
          <template x-if="doc.ai_summary">
            <div class="card p-5">
              <h3 class="font-bold text-slate-800 dark:text-white mb-3 text-sm flex items-center gap-2">
                <i data-lucide="brain-circuit" class="w-4 h-4 text-primary-500"></i>
                ملخص الذكاء الاصطناعي
              </h3>
              <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed" x-text="doc.ai_summary"></p>
            </div>
          </template>

          <!-- Detailed Audit Results -->
          <template x-if="ruleDetails.length > 0">
            <div class="card p-5">
              <h3 class="font-bold text-slate-800 dark:text-white mb-4 text-sm flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-primary-500"></i>
                نتائج التدقيق
              </h3>
              <div class="space-y-2">
                <template x-for="rule in ruleDetails" :key="rule.code">
                  <div class="flex items-start gap-3 p-3 rounded-xl border"
                       :class="rule.passed ? 'bg-green-50 dark:bg-green-900/10 border-green-200 dark:border-green-800/30' : 'bg-red-50 dark:bg-red-900/10 border-red-200 dark:border-red-800/30'">
                    <div class="flex-shrink-0 mt-0.5">
                      <template x-if="rule.passed"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i></template>
                      <template x-if="!rule.passed"><i data-lucide="x-circle" class="w-4 h-4 text-red-500"></i></template>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-xs font-mono bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded" x-text="rule.code"></span>
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-200" x-text="rule.name"></span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-semibold"
                              :class="{
                                'bg-red-100 text-red-700 dark:bg-red-900/20 dark:text-red-400': rule.severity==='critical',
                                'bg-orange-100 text-orange-700 dark:bg-orange-900/20 dark:text-orange-400': rule.severity==='high',
                                'bg-amber-100 text-amber-700 dark:bg-amber-900/20 dark:text-amber-400': rule.severity==='medium',
                                'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-400': rule.severity==='low'
                              }"
                              x-text="severityLabel(rule.severity)"></span>
                      </div>
                      <template x-if="!rule.passed && rule.message">
                        <p class="text-xs text-red-600 dark:text-red-400 mt-1" x-text="rule.message"></p>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Sidebar: validation -->
        <div class="space-y-5">

          <!-- Rules passed -->
          <div class="card p-5">
            <h3 class="font-bold text-slate-800 dark:text-white mb-3 text-sm">نتائج التحقق</h3>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div class="bg-green-50 dark:bg-green-900/20 rounded-xl p-3 text-center">
                <p class="text-xs text-slate-400 mb-0.5">نجحت</p>
                <p class="text-xl font-bold text-green-600 font-mono" x-text="doc.rules_passed || 0"></p>
              </div>
              <div class="bg-red-50 dark:bg-red-900/20 rounded-xl p-3 text-center">
                <p class="text-xs text-slate-400 mb-0.5">فشلت</p>
                <p class="text-xl font-bold text-red-600 font-mono" x-text="doc.rules_failed || 0"></p>
              </div>
            </div>
            <template x-if="doc.failed_rule_codes && doc.failed_rule_codes.length > 0">
              <div>
                <p class="text-xs text-slate-400 mb-2">القواعد المخفقة:</p>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="code in doc.failed_rule_codes" :key="code">
                    <span class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 text-xs font-mono px-2 py-0.5 rounded border border-red-200 dark:border-red-800" x-text="code"></span>
                  </template>
                </div>
              </div>
            </template>
            <template x-if="!doc.failed_rule_codes || doc.failed_rule_codes.length === 0">
              <div class="flex items-center gap-2 text-green-600 dark:text-green-400 text-sm">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>جميع القواعد نجحت</span>
              </div>
            </template>
          </div>

          <!-- Notes -->
          <div class="card p-5">
            <h3 class="font-bold text-slate-800 dark:text-white mb-3 text-sm">ملاحظات</h3>
            <textarea x-model="notes" rows="4" class="input-field w-full text-sm resize-none" placeholder="أضف ملاحظاتك..."></textarea>
            <button @click="saveNotes()" :disabled="saving" class="w-full mt-2 btn-primary text-sm h-8 rounded-lg disabled:opacity-50">حفظ</button>
          </div>

        </div>
      </div>
    </div>
  </template>
</div>
{%  endblock %}

{%  block scripts %}
<script>
function docDetail() {
  const docId   = window.location.pathname.split('/').filter(Boolean).pop();
  const apiPath = '/api/v1/documents/sales-receipts/';
  return {
    doc: null, loading: true, saving: false, notes: '',

    async load() {
      try {
        this.doc = await apiFetch(apiPath + docId + '/');
        this.notes = this.doc.notes || '';
      } catch(e) { notify('خطأ في التحميل', 'error'); }
      finally { this.loading = false; this.$nextTick(() => lucide.createIcons()); }
    },

    get docTitle() { return this.doc.receipt_number || 'إيصال ' + this.doc.id?.slice(0,8); },
    get fields() { return [
        ['رقم الإيصال', this.doc.receipt_number],['التاريخ', this.doc.receipt_date],
        ['النوع', this.doc.receipt_type],['البائع', this.doc.seller_name],
        ['الرقم الضريبي للبائع', this.doc.seller_vat_number],['العميل', this.doc.customer_name],
        ['المبلغ قبل الضريبة', this.fmtNum(this.doc.subtotal)],['نسبة الضريبة', (this.doc.vat_rate||15) + '%'],
        ['مبلغ الضريبة', this.fmtNum(this.doc.vat_amount)],['الإجمالي', this.fmtNum(this.doc.total_amount)],
        ['QR Code', this.doc.has_qr_code ? (this.doc.qr_code_valid ? '✅ صحيح' : '⚠️ غير صحيح') : '❌ مفقود'],['مكرر', this.doc.is_duplicate ? '⚠️ نعم' : '✅ لا'],
      ]; },
    get lineItems() { return this.doc.line_items || []; },
    get itemCols() { return ['الوصف','الكمية','سعر الوحدة','الإجمالي']; },
    get itemKeys() { return ['description','qty','unit_price','total']; },

    async approve() {
      this.saving = true;
      try {
        const r = await apiFetch(apiPath + docId + '/', {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ audit_status: 'approved' })
        });
        const d = await r.json();
        this.doc.audit_status = d.audit_status || 'approved';
        notify('تم الاعتماد', 'success');
      } catch(e) { notify('خطأ', 'error'); }
      finally { this.saving = false; }
    },

    async saveNotes() {
      this.saving = true;
      try {
        await apiFetch(apiPath + docId + '/', {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ notes: this.notes })
        });
        notify('تم الحفظ', 'success');
      } catch(e) { notify('خطأ', 'error'); }
      finally { this.saving = false; }
    },

    get ruleDetails() { return this.doc?.validation_details?.rule_details || []; },
    severityLabel(s) { return {critical:'حرج',high:'عالي',medium:'متوسط',low:'منخفض'}[s]??s; },
    fmtDate(d) { return d ? new Date(d).toLocaleString(APP_LOCALE) : '—'; },
    fmtNum(v) { return v ? Number(v).toLocaleString(APP_LOCALE, {maximumFractionDigits:2}) : '—'; },
    scoreColor(s) { return s>=85?'bg-green-500':s>=70?'bg-amber-400':s>=50?'bg-orange-500':'bg-red-500'; },
    riskLabel(l) { return {critical:'حرج',high:'عالي',medium:'متوسط',low:'منخفض'}[l]??l; },
    riskBadge(l) { return {critical:'bg-red-50 text-red-700 border-red-200 dark:bg-red-900/20 dark:text-red-400 dark:border-red-800',high:'bg-orange-50 text-orange-700 border-orange-200',medium:'bg-amber-50 text-amber-700 border-amber-200',low:'bg-green-50 text-green-700 border-green-200'}[l]??''; },
    statusLabel(s) { return {validated:'تم التحقق',flagged:'مُعلَّق',approved:'مُعتمَد',pending:'قيد الانتظار',rejected:'مرفوض'}[s]??s; },
    statusBadge(s) { return {validated:'bg-blue-50 text-blue-700 border-blue-200',flagged:'bg-amber-50 text-amber-700 border-amber-200',approved:'bg-green-50 text-green-700 border-green-200',rejected:'bg-red-50 text-red-700 border-red-200',pending:'bg-slate-50 text-slate-600 border-slate-200'}[s]??''; },
  }
}
</script>
{%  endblock %}
