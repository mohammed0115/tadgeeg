server_tokens off;

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

resolver 127.0.0.11 ipv6=off valid=30s;

# Default catch-all: redirect unknown domains to live
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/tadgeeg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tadgeeg.com/privkey.pem;
    return 301 https://tadgeeg.com$request_uri;
}

server {
    listen 80;
    server_name tadgeeg.com www.tadgeeg.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tadgeeg.com www.tadgeeg.com;

    ssl_certificate /etc/letsencrypt/live/tadgeeg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tadgeeg.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location /static/ {
        alias /vol/live/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /vol/live/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        set $upstream_live web_live;
        proxy_pass http://$upstream_live:8000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300;
    }
}

