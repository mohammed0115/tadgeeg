      summary: Perform Benford's Law analysis on transaction amounts
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: Start date (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
        description: End date (YYYY-MM-DD)
      - in: query
        name: transaction_type
        schema:
          type: string
        description: Filter by type
      tags:
      - Analytics
      security:
      - JWTCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_analytics_benford_create
      description: Run Benford's Law analysis on transaction amounts.
      summary: Perform Benford's Law analysis on transaction amounts
      tags:
      - Analytics
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
