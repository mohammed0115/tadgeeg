# pytest configuration
# See: https://docs.pytest.org/en/latest/reference.html

[pytest]
DJANGO_SETTINGS_MODULE = finai_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=apps
    --cov=core
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=45
# `tests` alone left 111 files uncollected — every test under apps/audit,
# apps/billing, apps/platform_admin and apps/frontend among them. A commit
# removed ActivityLog.chain_hash, broke four tests in apps/audit/tests, and
# still reported a fully green suite, because none of those files were ever
# collected. Coverage is measured over `apps` and `core`, so the old setting
# also scored a coverage floor against code whose tests never ran.
testpaths = tests apps core
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-related
    django_db: marks tests that need database access
    celery: marks tests for Celery tasks
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
