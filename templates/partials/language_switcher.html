{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form method="post" action="/i18n/setlang/" class="{{ extra_classes|default:'inline-flex items-center gap-1 rounded-2xl border border-slate-200 bg-white/80 p-1 text-xs font-semibold text-slate-600 shadow-sm' }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path|default:'/' }}">
  <button type="submit"
          name="language"
          value="ar"
          class="rounded-xl px-3 py-2 transition {% if CURRENT_LANGUAGE == 'ar' %}bg-slate-950 text-white shadow-sm{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
    {% if CURRENT_LANGUAGE == 'ar' %}العربية{% else %}Arabic{% endif %}
  </button>
  <button type="submit"
          name="language"
          value="en"
          class="rounded-xl px-3 py-2 transition {% if CURRENT_LANGUAGE == 'en' %}bg-slate-950 text-white shadow-sm{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
    {% if CURRENT_LANGUAGE == 'ar' %}الإنجليزية{% else %}English{% endif %}
  </button>
</form>
