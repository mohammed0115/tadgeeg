name: finai-multi-env

services:

  # ── Shared Redis (used by all environments) ──────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Live environment ─────────────────────────────────────────────────────────
  db_live:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./env/live.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_live_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web_live:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/live.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db_live:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "gunicorn finai_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-4}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    volumes:
      - static_live:/app/staticfiles
      - media_live:/app/media
      - logs_live:/app/logs
      # Partner commercial registers and certificates. On NO volume before this,
      # so every `docker compose up --build` destroyed them. Deliberately a
      # separate volume from media_live: nginx serves media publicly and must
      # never be able to reach this one.
      - private_live:/app/private_media

  celery_live:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/live.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # No statement timeout for workers: an audit run legitimately reads for
      # minutes. The 30s default exists to protect gunicorn workers, which
      # celery is not. See core/utils/database.py.
      - DB_STATEMENT_TIMEOUT_MS=0
    depends_on:
      db_live:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A finai_backend worker --loglevel=info --concurrency=2
    volumes:
      - media_live:/app/media
      - logs_live:/app/logs
      - private_live:/app/private_media

  # ── Dev environment ──────────────────────────────────────────────────────────
  db_dev:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./env/dev.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web_dev:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/dev.env
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "gunicorn finai_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-2}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    volumes:
      - static_dev:/app/staticfiles
      - media_dev:/app/media
      - logs_dev:/app/logs
      - private_dev:/app/private_media

  celery_dev:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/dev.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - DB_STATEMENT_TIMEOUT_MS=0  # see celery_live
    depends_on:
      db_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A finai_backend worker --loglevel=info --concurrency=2
    volumes:
      - media_dev:/app/media
      - logs_dev:/app/logs
      - private_dev:/app/private_media

  # ── Test environment ─────────────────────────────────────────────────────────
  db_test:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./env/test.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web_test:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/test.env
    environment:
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      db_test:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "gunicorn finai_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-2}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    volumes:
      - static_test:/app/staticfiles
      - media_test:/app/media
      - logs_test:/app/logs
      - private_test:/app/private_media

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_live:/vol/live/static:ro
      - media_live:/vol/live/media:ro
      - static_dev:/vol/dev/static:ro
      - media_dev:/vol/dev/media:ro
      - static_test:/vol/test/static:ro
      - media_test:/vol/test/media:ro
      - ./nginx/generated/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["manual"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  redis_data:
  mysql_live_data:
  mysql_dev_data:
  mysql_test_data:
  static_live:
  static_dev:
  static_test:
  media_live:
  media_dev:
  media_test:
  logs_live:
  logs_dev:
  logs_test:
  # Private partner documents. NOT mounted into the nginx container — see the
  # nginx service above, which mounts only static_* and media_*. Adding these
  # there would put third-party commercial registers behind a public alias.
  private_live:
  private_dev:
  private_test:
