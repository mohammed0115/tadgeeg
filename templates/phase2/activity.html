{% extends "phase2/base_phase2.html" %}
{% load i18n %}

{% block title %}{% trans "Activity Log" %}{% endblock %}
{% block page_title %}{% trans "Activity Log" %}{% endblock %}
{% block tab_activity %}active{% endblock %}

{% block phase2_content %}
<div x-data="activityLog()" x-init="init()" class="space-y-4">

  <!-- Toolbar -->
  <div class="card p-4">
    <div class="flex flex-wrap items-center gap-3">
      <!-- Action type filter -->
      <select class="select" x-model="filters.action" @change="loadLogs()">
        <option value="">{% trans "All Actions" %}</option>
        <optgroup label="{% trans 'Files' %}">
          <option value="file_uploaded">{% trans "File Uploaded" %}</option>
          <option value="file_archived">{% trans "File Archived" %}</option>
          <option value="file_restored">{% trans "File Restored" %}</option>
          <option value="file_deleted">{% trans "File Deleted" %}</option>
          <option value="file_downloaded">{% trans "File Downloaded" %}</option>
        </optgroup>
        <optgroup label="{% trans 'Folders' %}">
          <option value="folder_created">{% trans "Folder Created" %}</option>
          <option value="folder_deleted">{% trans "Folder Deleted" %}</option>
        </optgroup>
        <optgroup label="{% trans 'Audits' %}">
          <option value="audit_started">{% trans "Audit Started" %}</option>
          <option value="audit_completed">{% trans "Audit Completed" %}</option>
          <option value="audit_failed">{% trans "Audit Failed" %}</option>
          <option value="audit_canceled">{% trans "Audit Canceled" %}</option>
        </optgroup>
        <optgroup label="{% trans 'Reports' %}">
          <option value="report_generated">{% trans "Report Generated" %}</option>
          <option value="report_downloaded">{% trans "Report Downloaded" %}</option>
        </optgroup>
        <optgroup label="{% trans 'Auth' %}">
          <option value="login">{% trans "Login" %}</option>
          <option value="logout">{% trans "Logout" %}</option>
        </optgroup>
      </select>

      <!-- Date from -->
      <div class="relative">
        <i data-lucide="calendar" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
        <input type="date"
               class="input pr-9 text-sm"
               x-model="filters.date_from"
               @change="loadLogs()"
               :max="filters.date_to || today">
      </div>

      <!-- Date to -->
      <div class="relative">
        <i data-lucide="calendar" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
        <input type="date"
               class="input pr-9 text-sm"
               x-model="filters.date_to"
               @change="loadLogs()"
               :min="filters.date_from"
               :max="today">
      </div>

      <!-- Clear filters -->
      <template x-if="filters.action || filters.date_from || filters.date_to">
        <button class="btn-ghost py-1 px-3 text-xs"
                @click="filters = { action: '', date_from: '', date_to: '' }; loadLogs()">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
          {% trans "Clear" %}
        </button>
      </template>

      <div class="flex-1"></div>

      <!-- Refresh -->
      <button class="btn-ghost" @click="loadLogs()" :disabled="loading" title="{% trans 'Refresh' %}">
        <i data-lucide="refresh-cw" class="w-4 h-4" :class="loading ? 'animate-spin' : ''"></i>
      </button>

      <!-- Export -->
      <button class="btn-ghost py-2 px-3 text-xs" @click="exportLogs()">
        <i data-lucide="download" class="w-4 h-4"></i>
        {% trans "Export" %}
      </button>
    </div>
  </div>

  <!-- Summary stats row -->
  <template x-if="!loading && logs.length > 0">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="card p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center flex-shrink-0">
          <i data-lucide="upload-cloud" class="w-4 h-4 text-blue-600 dark:text-blue-400"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400">{% trans "File Events" %}</p>
          <p class="font-bold text-slate-800 dark:text-white" x-text="countByCategory('file')"></p>
        </div>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center flex-shrink-0">
          <i data-lucide="shield-check" class="w-4 h-4 text-amber-600 dark:text-amber-400"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400">{% trans "Audit Events" %}</p>
          <p class="font-bold text-slate-800 dark:text-white" x-text="countByCategory('audit')"></p>
        </div>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center flex-shrink-0">
          <i data-lucide="file-text" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400">{% trans "Report Events" %}</p>
          <p class="font-bold text-slate-800 dark:text-white" x-text="countByCategory('report')"></p>
        </div>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-violet-100 dark:bg-violet-900/30 flex items-center justify-center flex-shrink-0">
          <i data-lucide="folder" class="w-4 h-4 text-violet-600 dark:text-violet-400"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400">{% trans "Folder Events" %}</p>
          <p class="font-bold text-slate-800 dark:text-white" x-text="countByCategory('folder')"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- Activity Table with Timeline -->
  <div class="card overflow-hidden">
    <!-- Loading skeleton -->
    <template x-if="loading">
      <div class="p-5 space-y-4">
        <template x-for="i in [1,2,3,4,5,6,7,8]" :key="i">
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 animate-pulse flex-shrink-0"></div>
            <div class="flex-1 h-4 rounded bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
            <div class="w-24 h-4 rounded bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
            <div class="w-28 h-4 rounded bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
          </div>
        </template>
      </div>
    </template>

    <!-- Empty state -->
    <template x-if="!loading && logs.length === 0">
      <div class="py-16 flex flex-col items-center gap-4 text-slate-400">
        <i data-lucide="clock" class="w-14 h-14 opacity-30"></i>
        <div class="text-center">
          <p class="font-semibold text-slate-600 dark:text-slate-300">{% trans "No activity logged yet" %}</p>
          <p class="text-sm mt-1">{% trans "Actions performed in the system will appear here." %}</p>
        </div>
      </div>
    </template>

    <!-- Table -->
    <template x-if="!loading && logs.length > 0">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>{% trans "Action" %}</th>
              <th>{% trans "Description" %}</th>
              <th>{% trans "Entity" %}</th>
              <th>{% trans "User" %}</th>
              <th>{% trans "IP Address" %}</th>
              <th>{% trans "Time" %}</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="log in visibleLogs" :key="log.id">
              <tr class="group">
                <!-- Action with timeline indicator -->
                <td>
                  <div class="flex items-center gap-2.5">
                    <!-- Colored left border indicator is on the <tr>, simulate with icon bg -->
                    <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center"
                         :class="actionIconBg(log.action)">
                      <i :data-lucide="actionIcon(log.action)" class="w-4 h-4"
                         :class="actionIconColor(log.action)"></i>
                    </div>
                    <div>
                      <p class="font-medium text-slate-700 dark:text-slate-200 text-xs whitespace-nowrap"
                         x-text="actionLabel(log.action)"></p>
                      <p class="text-[10px] font-mono text-slate-400" x-text="log.action || ''"></p>
                    </div>
                  </div>
                </td>

                <!-- Description -->
                <td class="max-w-[250px]">
                  <p class="text-sm text-slate-600 dark:text-slate-300 truncate"
                     x-text="log.description || log.details || '—'"
                     :title="log.description || log.details || ''"></p>
                </td>

                <!-- Entity -->
                <td>
                  <template x-if="log.entity_type && log.entity_id">
                    <div>
                      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400"
                         x-text="(log.entity_type || '').toUpperCase()"></p>
                      <p class="text-xs font-mono text-slate-400 truncate max-w-[100px]"
                         x-text="log.entity_id || ''"></p>
                    </div>
                  </template>
                  <template x-if="!log.entity_type || !log.entity_id">
                    <span class="text-slate-400 text-xs">—</span>
                  </template>
                </td>

                <!-- User -->
                <td>
                  <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-br from-primary-500 to-violet-500 flex items-center justify-center text-white text-[9px] font-bold flex-shrink-0">
                      <span x-text="(log.user_email || log.user || '?').charAt(0).toUpperCase()"></span>
                    </div>
                    <span class="text-xs text-slate-600 dark:text-slate-300 truncate max-w-[120px]"
                          x-text="log.user_email || log.user || '—'"></span>
                  </div>
                </td>

                <!-- IP Address -->
                <td>
                  <span class="text-xs font-mono text-slate-500 dark:text-slate-400"
                        x-text="log.ip_address || log.ip || '—'"></span>
                </td>

                <!-- Time -->
                <td class="whitespace-nowrap">
                  <div>
                    <p class="text-xs text-slate-600 dark:text-slate-300"
                       x-text="(log.timestamp || log.created_at || '').slice(0,16).replace('T',' ')"></p>
                    <p class="text-[10px] text-slate-400"
                       x-text="relativeTime(log.timestamp || log.created_at)"></p>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <!-- Pagination footer -->
    <template x-if="!loading && logs.length > pageSize">
      <div class="px-5 py-3 border-t border-slate-100 dark:border-slate-700/30 flex items-center justify-between">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          {% trans "Showing" %}
          <span x-text="((currentPage - 1) * pageSize) + 1"></span>–<span x-text="Math.min(currentPage * pageSize, logs.length)"></span>
          {% trans "of" %} <span x-text="logs.length"></span>
        </p>
        <div class="flex items-center gap-1">
          <button class="btn-ghost py-1 px-2.5 text-xs"
                  :disabled="currentPage === 1"
                  @click="currentPage--">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-slate-600 dark:text-slate-300 px-2"
                x-text="currentPage + ' / ' + Math.ceil(logs.length / pageSize)"></span>
          <button class="btn-ghost py-1 px-2.5 text-xs"
                  :disabled="currentPage >= Math.ceil(logs.length / pageSize)"
                  @click="currentPage++">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </template>
  </div>

</div>
{% endblock %}

{% block page_js %}
<script>
function activityLog() {
  return {
    logs: [],
    loading: true,
    filters: { action: '', date_from: '', date_to: '' },
    currentPage: 1,
    pageSize: 25,
    today: new Date().toISOString().slice(0, 10),

    get visibleLogs() {
      const start = (this.currentPage - 1) * this.pageSize;
      return this.logs.slice(start, start + this.pageSize);
    },

    async init() {
      await this.loadLogs();
      this.$nextTick(() => lucide.createIcons());
    },

    async loadLogs() {
      this.loading = true;
      this.currentPage = 1;
      try {
        const params = new URLSearchParams();
        if (this.filters.action) params.set('action', this.filters.action);
        if (this.filters.date_from) params.set('date_from', this.filters.date_from);
        if (this.filters.date_to) params.set('date_to', this.filters.date_to);
        params.set('page_size', 200);

        const data = await apiFetch('/activity-logs/?' + params.toString());
        this.logs = Array.isArray(data) ? data : (data?.results || []);
      } catch (e) {
        notify(e.message || '{% trans "Failed to load activity logs." %}', 'error');
      } finally {
        this.loading = false;
        this.$nextTick(() => lucide.createIcons());
      }
    },

    exportLogs() {
      const params = new URLSearchParams();
      if (this.filters.action) params.set('action', this.filters.action);
      if (this.filters.date_from) params.set('date_from', this.filters.date_from);
      if (this.filters.date_to) params.set('date_to', this.filters.date_to);
      params.set('format', 'csv');
      window.open(`/api/v1/activity-logs/export/?` + params.toString(), '_blank');
    },

    countByCategory(category) {
      return this.logs.filter(l => (l.action || '').startsWith(category)).length;
    },

    actionIcon(action) {
      const map = {
        file_uploaded: 'upload-cloud',
        file_archived: 'archive',
        file_restored: 'refresh-cw',
        file_deleted: 'trash-2',
        file_downloaded: 'download',
        folder_created: 'folder-plus',
        folder_deleted: 'folder-minus',
        audit_started: 'play-circle',
        audit_completed: 'check-circle',
        audit_failed: 'x-circle',
        audit_canceled: 'minus-circle',
        report_generated: 'file-text',
        report_downloaded: 'download',
        login: 'log-in',
        logout: 'log-out',
        storage_configured: 'hard-drive',
        storage_deleted: 'hard-drive',
      };
      return map[action] || 'circle';
    },

    actionIconBg(action) {
      if (!action) return 'bg-slate-200 dark:bg-slate-700';
      if (action.startsWith('file')) return 'bg-blue-100 dark:bg-blue-900/30';
      if (action.startsWith('folder')) return 'bg-violet-100 dark:bg-violet-900/30';
      if (action.startsWith('audit')) return 'bg-amber-100 dark:bg-amber-900/30';
      if (action.startsWith('report')) return 'bg-emerald-100 dark:bg-emerald-900/30';
      if (action.startsWith('storage')) return 'bg-orange-100 dark:bg-orange-900/30';
      return 'bg-slate-100 dark:bg-slate-700';
    },

    actionIconColor(action) {
      if (!action) return 'text-slate-400';
      if (action.startsWith('file')) return 'text-blue-600 dark:text-blue-400';
      if (action.startsWith('folder')) return 'text-violet-600 dark:text-violet-400';
      if (action.startsWith('audit')) return 'text-amber-600 dark:text-amber-400';
      if (action.startsWith('report')) return 'text-emerald-600 dark:text-emerald-400';
      if (action.startsWith('storage')) return 'text-orange-600 dark:text-orange-400';
      return 'text-slate-400';
    },

    actionLabel(action) {
      const map = {
        file_uploaded: '{% trans "File Uploaded" %}',
        file_archived: '{% trans "File Archived" %}',
        file_restored: '{% trans "File Restored" %}',
        file_deleted: '{% trans "File Deleted" %}',
        file_downloaded: '{% trans "File Downloaded" %}',
        folder_created: '{% trans "Folder Created" %}',
        folder_deleted: '{% trans "Folder Deleted" %}',
        audit_started: '{% trans "Audit Started" %}',
        audit_completed: '{% trans "Audit Completed" %}',
        audit_failed: '{% trans "Audit Failed" %}',
        audit_canceled: '{% trans "Audit Canceled" %}',
        report_generated: '{% trans "Report Generated" %}',
        report_downloaded: '{% trans "Report Downloaded" %}',
        login: '{% trans "Logged In" %}',
        logout: '{% trans "Logged Out" %}',
        storage_configured: '{% trans "Storage Configured" %}',
      };
      return map[action] || action || '—';
    },

    relativeTime(str) {
      if (!str) return '';
      const diff = Math.floor((Date.now() - new Date(str).getTime()) / 1000);
      if (diff < 60) return diff + '{% trans "s ago" %}';
      if (diff < 3600) return Math.floor(diff / 60) + '{% trans "m ago" %}';
      if (diff < 86400) return Math.floor(diff / 3600) + '{% trans "h ago" %}';
      return Math.floor(diff / 86400) + '{% trans "d ago" %}';
    },
  };
}
</script>
{% endblock %}
